services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  neo4j:
    image: neo4j:2025.11.2
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/rabbithole
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

volumes:
  neo4j_data: